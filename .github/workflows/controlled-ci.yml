name: Controlled CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controlled-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source, statistics, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Team Statistics
        run: npm run test:teams

      - name: Verify H2H ordering
        run: npm run test:h2h-order

      - name: Verify source compatibility
        run: npm run test:ipbl-compat

      - name: Verify client timeouts
        run: npm run test:client-timeout

      - name: Verify live clock behavior
        run: npm run test:live-clock

      - name: Verify bookmaker normalization
        run: npm run test:bookmaker-live

      - name: Verify IPBL source contracts
        run: npm run test:ipbl-source

      - name: Verify Myanmar time conversion
        run: node --loader ./tests/ipbl-source/ts-extension-loader.mjs src/time/__tests__/myanmar.test.ts

      - name: Verify live source status labels
        run: node --loader ./tests/ipbl-source/ts-extension-loader.mjs tests/live-source-status.test.ts

      - name: Verify cron recorder authorization
        run: node --loader ./tests/ipbl-source/ts-extension-loader.mjs tests/live-recorder.test.ts

      - name: Verify canonical H2H source isolation
        run: node --loader ./tests/ipbl-source/ts-extension-loader.mjs tests/supabase-team-history-fallback.test.ts

      - name: Verify current official IPBL routing
        run: node tests/official-source-routing.test.mjs

      - name: Verify official H2H season and history source
        run: node --loader ./tests/ipbl-source/ts-extension-loader.mjs tests/team-history-official-season.test.ts

      - name: Verify canonical Supabase Results projection
        run: node --loader ./tests/ipbl-source/ts-extension-loader.mjs tests/supabase-results-calendar.test.ts

      - name: Verify IPBL selected-match season and H2H
        run: node --loader ./tests/ipbl-source/ts-extension-loader.mjs tests/ipbl-game-season.test.ts

      - name: Verify H2H selection isolation
        run: node --loader ./tests/ipbl-source/ts-extension-loader.mjs tests/h2h-request-guard.test.ts

      - name: Verify Live official reconciliation monotonicity
        run: npm run test:live-reconciliation

      - name: Verify Betting Record row/date integrity
        run: node --loader ./tests/ipbl-source/ts-extension-loader.mjs tests/betting-history.test.ts

      - name: Verify imported betting settlement semantics
        run: node --loader ./tests/ipbl-source/ts-extension-loader.mjs tests/betting-intelligence.test.ts

      - name: Build production bundle
        run: npm run build
